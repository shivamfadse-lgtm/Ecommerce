<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartDeliver AI | Nanded Delivery Intelligence</title>
  
  <!-- Google Fonts: Serif for titles, Sans-Serif for interface -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>

  <!-- Left Fixed Sidebar (235px) -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <span class="brand-mark">SD</span>
        <span class="brand-title">SmartDeliver <b>AI</b></span>
      </div>
      <div class="eyebrow">DELIVERY INTELLIGENCE</div>
    </div>

    <nav class="sidebar-nav">
      <button class="nav active" data-view="dashboard">
        <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>Overview</span>
      </button>
      <button class="nav" data-view="recommendations">
        <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a8 8 0 0 0-8 8c0 5.25 8 12 8 12s8-6.75 8-12a8 8 0 0 0-8-8z"/><circle cx="12" cy="10" r="3"/></svg>
        <span>Recommendations</span>
      </button>
      <button class="nav" data-view="analytics">
        <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        <span>AI Analytics</span>
      </button>
      <button class="nav" data-view="network-map">
        <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
        <span>Network Map</span>
      </button>
      <button class="nav" data-view="scenario">
        <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 18h12M6 6h12M6 12h12"/></svg>
        <span>Scenario Simulator</span>
      </button>
      <button class="nav" data-view="impact">
        <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span>Business Impact</span>
      </button>
      <button class="nav" data-view="methodology">
        <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        <span>Methodology</span>
      </button>
      <button class="nav" data-view="data-management">
        <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span>Data Management</span>
      </button>
    </nav>

    <div class="sidebar-bottom">
      <div class="demo-note">
        <span class="status-dot"></span>
        <div>
          <strong>Demo Data Mode</strong>
          <small>Illustrative Nanded Dataset</small>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Dashboard Content -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <span class="location-tag">NANDED, MAHARASHTRA</span>
        <h1 class="page-title">Nanded Delivery Intelligence</h1>
      </div>
      
      <div class="topbar-right">
        <div class="priority-wrapper">
          <label for="priority" class="priority-label">Business priority</label>
          <div class="select-container">
            <select id="priority" class="priority-select">
              <option value="Balanced">Balanced</option>
              <option value="Fast Delivery">Fast Delivery</option>
              <option value="Low Cost">Low Cost</option>
              <option value="Maximum Customer Coverage">Maximum Customer Coverage</option>
              <option value="High Demand">High Demand</option>
            </select>
            <span class="select-arrow">▾</span>
          </div>
        </div>

        <div id="user-profile" class="user-profile"></div>
        <button id="logout-button" class="logout-button" type="button">Log in / Register</button>
      </div>
    </header>

    <!-- Content View Root -->
    <section id="app" class="content">
      <div class="loading">
        <div class="spinner"></div>
        <span>Running geospatial clustering & demand analysis for Nanded...</span>
      </div>
    </section>
  </main>

  <!-- External Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>
